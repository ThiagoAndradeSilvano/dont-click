<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Velha</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body onload="initialize()">
  <h1>Jogo da Velha</h1>
  <table id="table_game">
    <tr>
      <td class="td_game"><div id="cell0" onclick="cellClicked(this.id)" class="fixed"></div></td>
      <td class="td_game"><div id="cell1" onclick="cellClicked(this.id)" class="fixed"></div></td>
      <td class="td_game"><div id="cell2" onclick="cellClicked(this.id)" class="fixed"></div></td>
    </tr>
    <tr>
      <td class="td_game"><div id="cell3" onclick="cellClicked(this.id)" class="fixed"></div></td>
      <td class="td_game"><div id="cell4" onclick="cellClicked(this.id)" class="fixed"></div></td>
      <td class="td_game"><div id="cell5" onclick="cellClicked(this.id)" class="fixed"></div></td>
    </tr>
    <tr>
      <td class="td_game"><div id="cell6" onclick="cellClicked(this.id)" class="fixed"></div></td>
      <td class="td_game"><div id="cell7" onclick="cellClicked(this.id)" class="fixed"></div></td>
      <td class="td_game"><div id="cell8" onclick="cellClicked(this.id)" class="fixed"></div></td>
    </tr>
  </table>
  <div id="restart" title="Reiniciar" onclick="restartGame(true)"><span style="vertical-align:top;position:relative;top:-10px">#</span></div>
  <table>
    <tr>
      <th class="th_list">Sistema</th>
      <th class="th_list" style="padding-right:10px;padding-left:10px">Empates</th>
      <th class="th_list">Você</th>
    </tr>
    <tr>
      <td class="td_list" id="computer_score">0</td>
      <td class="td_list" id="tie_score">0</td>
      <td class="td_list" id="player_score">0</td>
    </tr>
  </table>

  <div id="winAnnounce" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('winAnnounce')">&times;</span>
      <p id="winText"></p>
    </div>
  </div>

  <div id="userFeedback" class="modal">
    <div class="modal-content">
      <p id="questionText"></p>
      <p><button id="yesBtn">Sim</button>&nbsp;<button id="noBtn">Não</button></p>
    </div>
  </div>

  <div id="optionsDlg" class="modal">
    <div class="modal-content">
      <h2>Configuração</h2>
      <h3>Dificuldade:</h3>
      <label><input type="radio" name="difficulty" id="r0" value="0" />Fácil&nbsp;</label>
      <label><input type="radio" name="difficulty" id="r1" value="1" checked />Impossível</label><br />
      <h3>Jogar como:</h3>
      <label><input type="radio" name="player" id="rx" value="x" checked />X (começa)&nbsp;</label>
      <label><input type="radio" name="player" id="ro" value="o" />O<br /></label>
      <p><button id="okBtn" onclick="getOptions()">Iniciar</button></p>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
